<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Métricas de Engajamento Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Painel de Retenção e Engajamento</h1>
            <p>Análise de desempenho acadêmico e monitoramento de risco</p>
        </header>

        <main>
            <div class="card">
                <h2>Relatório Consolidado de Alunos</h2>
                <div class="table-responsive">
                    <table id="tabela-alunos">
                        <thead>
                            <tr>
                                <th>Matrícula</th>
                                <th>Nome do Aluno</th>
                                <th>Média</th>
                                <th>Frequência</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="scripts/main.js"></script>
</body>
</html>
